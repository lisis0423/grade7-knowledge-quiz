<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>知识闯关 · 七年级复习小游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn back" id="backBtn" title="返回" aria-label="返回" hidden>←</button>
      <div class="brand">
        <span class="brand-mark">知</span>
        <span class="brand-text" id="brandText">知识闯关<small>七年级 · 复习与预习</small></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="wrongBtn" title="错题本" aria-label="错题本">📕</button>
        <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
      </div>
    </header>

    <main id="view"></main>

    <footer class="foot">
      <span>答错不要紧，错题本会帮你记住</span>
      <span class="dot">·</span>
      <span>进度保存在本机，无需联网</span>
    </footer>
  </div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">这个游戏需要启用 JavaScript 才能运行。</p>
  </noscript>

  <!-- 1. 基础设施：科目注册表 / 本地存储 / 音效 -->
  <script src="js/subjects.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>

  <!-- 2. 数据：装备、任务剧情、题库。新增科目时，在这里加一行 <script> 即可 -->
  <script src="data/items.js"></script>
  <script src="js/avatar.js"></script>
  <script src="data/missions.js"></script>
  <script src="data/missions-more.js"></script>
  <script src="data/missions-extra.js"></script>
  <script src="data/missions-7b.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="data/intro.js"></script>
  <script src="data/geography-1.js"></script>
  <script src="data/geography-2.js"></script>
  <script src="data/geography-3.js"></script>
  <script src="data/geography-4.js"></script>
  <script src="data/math.js"></script>
  <script src="data/chinese.js"></script>
  <script src="data/english.js"></script>
  <script src="data/biology.js"></script>
  <script src="data/history.js"></script>
  <script src="data/politics.js"></script>
  <script src="data/placeholders.js"></script>

  <!-- 3. 规则引擎、答题组件与页面路由 -->
  <script src="js/rpg.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
